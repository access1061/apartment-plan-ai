[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floorplan-ai"
version = "0.1.0"
description = "Testable CLI pipeline for extracting apartment floor plan geometry"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vision = ["numpy>=1.24", "opencv-python>=4.8", "Pillow>=10.0"]
ocr = ["pytesseract>=0.3.10"]
pdf = ["pypdfium2>=4.25"]
dev = ["pytest>=7.4"]

[project.scripts]
floorplan = "floorplan_ai.cli:main"

[tool.setuptools.packages.find]
include = ["floorplan_ai*"]
